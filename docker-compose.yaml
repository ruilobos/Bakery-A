# Local dev/test environment (ADR-014): the app built from the Dockerfile Railway
# deploys (ADR-004), beside PostgreSQL 17 as its own service (ADR-007, ADR-026).
#
# Secrets come from `.env` beside this file, which compose reads for the ${...}
# below and which is never committed: copy `.env.example` (task 2.1). Ports are
# published on 127.0.0.1 only.
name: bakery

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: simple
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # host-side runserver and pytest reach it via .env's DATABASE_URL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simple"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .  # runs the image's own CMD, the start command Railway runs; no override here
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (copy .env.example)}
      # Not .env's DATABASE_URL: that one names localhost for host-side commands,
      # and inside the network the database is the `postgres` service.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}@postgres:5432/simple
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: bakery_pgdata  # fixed name, whatever the checkout folder is called
