# Tool configuration only (ADR-034): never a [project] or [build-system] table,
# and no dependencies, which live in requirements files (ADR-029, ADR-046).

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bakery.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
# Coverage is measured on every run but not enforced: 6.22 adds the 70% floor
# (ADR-031) by appending --cov-fail-under=70 here.
addopts = "--cov --cov-report=term-missing:skip-covered"
# No testpaths: collection starts at the repo root, so scripts/'s unittest tests
# cannot be left out by a list nobody updated (ADR-044).

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
]

# ruff lints and formats (ADR-034) at the version pinned in requirements-dev.txt,
# whose default rule set is the one enforced. Line length and quote style stay at
# the formatter's defaults, black's style.
[tool.ruff]
# The installed runtime (python:3.9-slim). A newer target emits syntax 3.9 cannot
# run; 19.9 moves it to py313 with CI's Python (ADR-025).
target-version = "py39"
# Generated by makemigrations in Django's own import order and layout, as
# coverage's omit above also recognises.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# 1.11's basic pass stays a floor whatever the default drops (ADR-011): today that
# adds only F722, syntax errors in string annotations.
extend-select = ["E9", "F63", "F7", "F82"]
# RUF012 wants ClassVar on mutable class attributes, which is how Django declares
# Meta.ordering, list_display and fields.
extend-ignore = ["RUF012"]
