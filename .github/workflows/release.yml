# The release step — task 1.10 (ADR-010, ADR-041, ADR-042).
#
# Every merge to `production` is tagged vX.Y.Z and published as a GitHub Release
# with generated notes. The version is the release PR's title, `Release vX.Y.Z`;
# scripts/release_version.py holds the rule for which versions may follow.
#
# A release PR merges `main` into `production` with "Create a merge commit",
# never squash (ADR-041). `check` validates it while open, and is advisory until
# 6.13 makes it a required status check; `publish` runs on the merge itself.
#
# If `publish` fails after a merge, `production` is untagged until fixed: correct
# the release PR's title and re-run the job. It re-reads the title, and a commit
# that already carries a v* tag is left alone. A 404/403 from `gh release create`
# instead means `main` has changed its workflows since the merge; ADR-042's
# Traps say how to publish that one release.

name: Release

on:
  pull_request:
    branches: [production]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [production]

# The repository default hands workflows a write token; each job asks for only
# what it uses instead.
permissions: {}

defaults:
  run:
    shell: bash  # -eo pipefail, so a failed `git tag` cannot hide behind the pipe

jobs:
  check:
    name: Validate release PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Release PRs come from main (ADR-010)
        if: github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'main'
        env:
          HEAD_LABEL: ${{ github.event.pull_request.head.label }}
        run: |
          echo "::error title=Release PR::A release PR merges main into production (ADR-010); this one comes from $HEAD_LABEL."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # every tag, for the version rule
          persist-credentials: false

      - name: Validate the version in the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: git tag --list 'v*' | python3 scripts/release_version.py --title "$TITLE"

  publish:
    name: Tag and publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag and the Release
      pull-requests: read  # find the release PR behind the merge commit
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether this commit is already released
        id: existing
        run: |
          tag=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | head -n 1)
          if [ -n "$tag" ]; then
            echo "::notice title=Release::$GITHUB_SHA is already released as $tag; nothing to do."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Choose the version from the release PR
        id: version
        if: steps.existing.outputs.tag == ''
        run: |
          title=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "production" and .merged_at != null)] | first | .title // empty')
          if [ -z "$title" ]; then
            echo "::error title=Release PR::No merged release PR found for $GITHUB_SHA; every change to production comes through one (ADR-010)."
            exit 1
          fi
          git tag --list 'v*' | python3 scripts/release_version.py --title "$title"

      - name: Publish the release
        if: steps.existing.outputs.tag == ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          # Pin where the notes start: GitHub's own choice of previous tag is undocumented.
          notes_from=()
          if [ -n "$PREVIOUS" ]; then
            notes_from=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${notes_from[@]}"
